# Configuration du projet de formation.
#
# Precedence (la premiere trouvee gagne) :
#   1. $ANSIBLE_CONFIG
#   2. ./ansible.cfg        <- ce fichier, si vous lancez depuis la racine du depot
#   3. ~/.ansible.cfg
#   4. /etc/ansible/ansible.cfg
#
# Un ansible.cfg situe dans un repertoire accessible en ecriture a tous
# (world-writable) est ignore par securite.

[defaults]
# Inventaire par defaut : votre projet. Les corriges se passent avec -i.
inventory = inventories/dev/hosts.yml

# Emplacements des roles. Le second chemin rend les roles des corriges
# resolvables par ansible-playbook ET par ansible-lint, y compris depuis les
# scenarios Molecule qui les appellent.
roles_path = roles:corrige/tp05-roles/roles:corrige/tp11-semaphore/roles

# collections_path n'est pas defini : les collections sont installees dans le
# chemin par defaut (~/.ansible/collections) a partir de
# collections/requirements.yml. Le confinement au projet (`collections_path =
# collections`) est introduit au module 10, avec la CI.

# Sortie lisible. ATTENTION : l'ancien `stdout_callback = yaml` pointait vers
# community.general.yaml, SUPPRIME en community.general 12.0.0. La methode
# actuelle est une option du callback `default` livre avec ansible-core.
callback_result_format = yaml

# Affiche le chemin du fichier fautif en cas d'echec : gain de temps reel.
show_task_path_on_failure = true

# Duree par tache et duree totale : indispensable pour raisonner performance.
# Ces deux callbacks vivent dans la collection ansible.posix, d'ou le FQCN.
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer

# `auto_silent` = decouverte automatique de l'interpreteur, sans avertissement.
# Debian 13 fournit Python 3.13, Rocky 10 fournit Python 3.12.
interpreter_python = auto_silent

# 5 par defaut. 10 suffit pour le lab ; a augmenter avec le parc.
forks = 10

# Laisse a True : la verification des cles d'hote est une protection reelle.
# L'acceptation a la premiere connexion est geree dans [ssh_connection].
host_key_checking = True

[privilege_escalation]
# Pas d'elevation par defaut : elle est demandee explicitement par `become: true`
# dans les plays qui en ont besoin. On evite ainsi de tout executer en root.
become        = false
become_method = sudo
become_user   = root

[ssh_connection]
# ControlMaster/ControlPersist : reutilisation de la connexion SSH, gain majeur.
# StrictHostKeyChecking=accept-new : accepte une cle inconnue a la premiere
# connexion (les VMs du lab sont recreees souvent) mais refuse toujours une cle
# QUI A CHANGE. C'est la bonne alternative a host_key_checking = False.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

# Reduit le nombre d'operations SSH par tache. Incompatible avec `requiretty`
# dans sudoers, absent des distributions modernes.
pipelining = true
