---
# Molecule 26.x - configuration "ansible-native".
#
# Depuis Molecule 25.9, le modele historique (driver / platforms / provisioner)
# est marque "pre ansible-native" et conserve pour compatibilite. La forme
# actuelle decrit l'infrastructure de test avec... Ansible lui-meme : un
# inventaire, un playbook `create.yml` et un playbook `destroy.yml`.
#
# ATTENTION : le schema est valide STRICTEMENT (additionalProperties: false).
# Une cle inconnue fait echouer molecule immediatement.

ansible:
  cfg:
    defaults:
      deprecation_warnings: false
      callback_result_format: yaml
      # INDISPENSABLE. Molecule genere son propre ansible.cfg dans un repertoire
      # ephemere et lance ansible-playbook depuis celui-ci : le `roles_path` de
      # l'ansible.cfg du projet, dont les chemins sont RELATIFS, n'y est pas
      # resolvable. Sans cette ligne, `molecule converge` echoue sur
      #   [ERROR]: The role 'nginx' was not found in: ...
      # Le chemin remonte du scenario (roles/nginx/molecule/default) jusqu'au
      # repertoire qui CONTIENT le role (roles/).
      roles_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../..
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=inventory/

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml

scenario:
  # Sequence explicite. `idempotence` rejoue `converge` et echoue si une
  # seule tache rapporte `changed` : c'est le test d'idempotence automatise.
  test_sequence:
    - dependency
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
