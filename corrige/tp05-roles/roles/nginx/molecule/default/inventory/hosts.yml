---
# Inventaire de test. Les deux familles du parc sont couvertes : le role doit
# fonctionner a l'identique sur Debian 13 et sur Rocky Linux 10.
all:
  children:
    molecule:
      hosts:
        debian13:
          container_image: docker.io/geerlingguy/docker-debian13-ansible:latest
        rocky10:
          container_image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
      vars:
        ansible_connection: containers.podman.podman
        # /sbin/init lance systemd dans le conteneur : indispensable pour
        # tester un role qui demarre un service.
        container_command: /sbin/init
        # `always` force le mode systemd de podman. La valeur `true` se
        # contente d'une autodetection, mise en defaut par `command`.
        container_systemd: always
