---
# `vars/` a une precedence ELEVEE : reserve a ce que l'appelant ne doit pas
# redefinir. Ici, les chemins imposes par l'empaquetage de la distribution.
nginx_chemins:
  Debian:
    disponibles: /etc/nginx/sites-available
    actives: /etc/nginx/sites-enabled
    site_defaut: /etc/nginx/sites-enabled/default
    utilisateur: www-data
  RedHat:
    disponibles: /etc/nginx/conf.d
    actives: /etc/nginx/conf.d
    # VERIFIE sur Rocky Linux 10 : apres installation du paquet nginx,
    # /etc/nginx/conf.d est VIDE. Il n'existe aucun default.conf a supprimer.
    # Le serveur par defaut de la distribution est declare directement dans
    # /etc/nginx/nginx.conf :
    #     server { listen 80; server_name _; root /usr/share/nginx/html; }
    # `site_defaut` est donc vide et la tache de suppression est ignoree.
    #
    # Ce serveur reste sans effet : nginx.conf fait
    #     include /etc/nginx/conf.d/*.conf;
    # AVANT de le declarer, et le PREMIER serveur rencontre pour un port en
    # devient le serveur par defaut. Les vhosts du role, inclus les premiers,
    # l'emportent donc - exactement comme sur Debian.
    site_defaut: ""
    utilisateur: nginx
