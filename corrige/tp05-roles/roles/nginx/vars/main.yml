---
# `vars/` a une precedence ELEVEE : reserve a ce que l'appelant ne doit pas
# redefinir. Ici, les chemins imposes par l'empaquetage de la distribution.
nginx_chemins:
  Debian:
    disponibles: /etc/nginx/sites-available
    actives: /etc/nginx/sites-enabled
    site_defaut: /etc/nginx/sites-enabled/default
    utilisateur: www-data
  RedHat:
    disponibles: /etc/nginx/conf.d
    actives: /etc/nginx/conf.d
    # RESERVE non tranchee faute de VM : sur RHEL-like, le serveur par defaut
    # est generalement declare directement dans /etc/nginx/nginx.conf, et non
    # dans conf.d/default.conf. La suppression de ce fichier est alors sans
    # effet, et l'assertion correspondante du scenario Molecule passe
    # trivialement. A verifier sur l'image Rocky avant de s'y fier.
    site_defaut: /etc/nginx/conf.d/default.conf
    utilisateur: nginx
