---
# Role nginx - taches principales.
# Les chemins dependant de la distribution sont lus dans vars/main.yml,
# indexes par ansible_facts['os_family'].

- name: Selectionner les chemins propres a la distribution
  ansible.builtin.set_fact:
    nginx_conf: "{{ nginx_chemins[ansible_facts['os_family']] }}"

# Rafraichir le cache de paquets est une difference de MECANISME entre familles,
# pas une difference de valeur : `ansible.builtin.package` n'expose pas d'option
# de rafraichissement, `apt` a `update_cache` et `dnf` gere le sien seul. C'est
# donc l'un des rares cas ou une condition sur la famille est justifiee, au meme
# titre que la mise a jour complete du TP 06.
#
# Sans cette tache, le role echoue sur toute machine dont le cache apt est vide
# ou perime - un conteneur de test neuf, ou une box epinglee dont les paquets
# ont ete retires du miroir :
#   No package matching 'nginx' is available
- name: Rafraichir le cache de paquets (famille Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Installer nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Activer nginx au demarrage
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true

- name: Creer la racine documentaire de chaque site
  ansible.builtin.file:
    path: "{{ nginx_site_racine }}/{{ item.nom }}"
    state: directory
    owner: root
    group: "{{ nginx_conf.utilisateur }}"
    mode: "0755"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.nom }}"

- name: Deposer la page d accueil de chaque site
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_site_racine }}/{{ site.nom }}/index.html"
    owner: root
    group: "{{ nginx_conf.utilisateur }}"
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: site
    label: "{{ site.nom }}"

- name: Generer la configuration de chaque vhost
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "{{ nginx_conf.disponibles }}/{{ site.nom }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: site
    label: "{{ site.nom }}"
  notify: configuration nginx modifiee

- name: Activer chaque vhost
  ansible.builtin.file:
    src: "{{ nginx_conf.disponibles }}/{{ site.nom }}.conf"
    dest: "{{ nginx_conf.actives }}/{{ site.nom }}.conf"
    state: link
    owner: root
    group: root
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: site
    label: "{{ site.nom }}"
  # Sur RedHat les deux repertoires sont confondus : le lien serait circulaire.
  when: nginx_conf.disponibles != nginx_conf.actives
  notify: configuration nginx modifiee

- name: Supprimer le site livre par la distribution
  ansible.builtin.file:
    path: "{{ nginx_conf.site_defaut }}"
    state: absent
  when:
    - nginx_supprimer_site_defaut | bool
    # Vide sur RedHat : il n'y a pas de fichier de site par defaut a supprimer.
    - nginx_conf.site_defaut | length > 0
  notify: configuration nginx modifiee

- name: Declencher les handlers en attente
  ansible.builtin.meta: flush_handlers

- name: Verifier que chaque site repond
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ site.port | default(nginx_port_defaut) }}/"
    # L'en-tete Host designe le vhost a interroger ; sans lui, nginx sert le
    # serveur par defaut du port. `follow_redirects: none` evite de suivre la
    # redirection HTTPS d'un site qui la declare, car TLS n'est pas servi ici.
    headers:
      Host: "{{ site.nom }}.{{ nginx_domaine }}"
    follow_redirects: none
    status_code: "{{ [301] if site.https_redirect | default(false) else [200] }}"
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: site
    label: "{{ site.nom }}"
  when:
    - nginx_verifier | bool
    - not ansible_check_mode
