---
# Rocky Linux 10 fournit PostgreSQL 16 sous le nom `postgresql-server`.
# La modularite dnf a disparu en EL10 : les autres versions sont des paquets
# prefixes (postgresql18-server), pas des streams.
postgres_paquets:
  - postgresql-server
  - postgresql-contrib
  # Requis par les modules community.postgresql (psycopg2 >= 2.5.1).
  - python3-psycopg2
  # Requis par les modules de fichiers d Ansible quand SELinux est actif,
  # ce qui est le cas par defaut sur Rocky 10.
  - python3-libselinux

postgres_datadir: /var/lib/pgsql/data
postgres_service: postgresql

# PORTEE DU ROLE : il installe un serveur en ecoute LOCALE et y cree bases et
# comptes. Il ne modifie ni `listen_addresses`, ni `port`, ni `pg_hba.conf` :
# rendre une base accessible depuis le reseau releve d'un durcissement qui
# depasse ce TP. `postgres_port` ne sert donc qu'a la regle de pare-feu, et
# changer sa valeur ne deplace PAS le serveur.
postgres_port: 5432

# Bases et comptes a creer. Vides par defaut.
postgres_bases: []
postgres_comptes: []

# Ouvrir le port dans firewalld, actif par defaut sur la box Rocky.
postgres_ouvrir_firewall: false
