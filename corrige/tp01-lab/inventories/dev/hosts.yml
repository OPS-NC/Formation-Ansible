---
# Inventaire minimal du TP 01 : atteindre les 4 VMs du lab J1/J2.
# Il sera structure en groupes fonctionnels au TP 02.
all:
  vars:
    ansible_user: vagrant

    # Vagrant genere une cle SSH par machine, deposee sous .vagrant/.
    # Le chemin est relatif : lancez toujours ansible depuis la racine du depot.
    ansible_ssh_private_key_file: ".vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key"

  hosts:
    web01:
      ansible_host: 192.168.56.11
    web02:
      ansible_host: 192.168.56.12
    db01:
      ansible_host: 192.168.56.21
    tools:
      ansible_host: 192.168.56.31
