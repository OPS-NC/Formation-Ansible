---
# Etape 2 - Configurer, en maitrisant l'etat applique.

- name: Configuration du routeur
  hosts: reseau
  gather_facts: false

  vars:
    # La configuration cible est une DONNEE, versionnee dans Git.
    interfaces_cibles:
      - name: eth1
        description: Reseau de lab
        enabled: true
      - name: eth2
        description: Reseau applicatif
        enabled: true

    adresses_cibles:
      - name: eth1
        ipv4:
          - address: 192.168.56.51/24
      - name: eth2
        ipv4:
          # Reseau applicatif. Il reste dans 192.168.56.0/21 : c'est la seule
          # plage host-only autorisee par defaut par VirtualBox, et le
          # Vagrantfile y place la seconde carte de net01.
          - address: 192.168.60.1/24

  tasks:

    # Sauvegarde AVANT toute modification : reflexe non negociable.
    - name: Sauvegarder la configuration courante
      vyos.vyos.vyos_config:
        backup: true
        backup_options:
          dir_path: "{{ playbook_dir }}/../fixtures/sauvegardes"
          filename: "net01-{{ '%Y%m%d-%H%M%S' | strftime }}.cfg"

    # `merged` : ajoute et modifie, ne supprime rien. L'etat le plus sur.
    - name: Appliquer la description des interfaces
      vyos.vyos.vyos_interfaces:
        config: "{{ interfaces_cibles }}"
        state: merged

    # `replaced` : remplace la configuration DES INTERFACES CITEES seulement.
    - name: Appliquer les adresses IP
      vyos.vyos.vyos_l3_interfaces:
        config: "{{ adresses_cibles }}"
        state: replaced

    - name: Relire la configuration appliquee
      vyos.vyos.vyos_l3_interfaces:
        state: gathered
      register: verification

    # Verifier qu'une interface PORTE LE BON NOM ne prouve rien : il faut
    # comparer les adresses reellement configurees au modele attendu.
    - name: Chaque adresse cible est presente sur la bonne interface
      ansible.builtin.assert:
        that:
          - adresses_relues[item.name] is defined
          - item.ipv4 | map(attribute='address') | list
            | difference(adresses_relues[item.name]) | length == 0
        fail_msg: >-
          {{ item.name }} attendait
          {{ item.ipv4 | map(attribute='address') | join(', ') }},
          mais porte {{ adresses_relues[item.name] | default([]) | join(', ') }}
      loop: "{{ adresses_cibles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        adresses_relues: >-
          {{ dict(verification.gathered | map(attribute='name')
                  | zip(verification.gathered
                        | map(attribute='ipv4', default=[])
                        | map('map', attribute='address') | map('list') | list)) }}

    # Second passage : une configuration deja conforme ne doit produire aucun
    # changement. C'est le test d'idempotence du module 04, applique au reseau.
    - name: Rejouer la configuration pour prouver l idempotence
      vyos.vyos.vyos_l3_interfaces:
        config: "{{ adresses_cibles }}"
        state: replaced
      register: second_passage

    - name: Le second passage ne doit rien modifier
      ansible.builtin.assert:
        that:
          - not second_passage.changed
        fail_msg: >-
          Le playbook n'est pas idempotent : commandes rejouees
          {{ second_passage.commands | default([]) | join(' ; ') }}
