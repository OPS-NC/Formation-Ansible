---
# Inventaire du parc de formation, environnement `dev`.
#
# Deux axes de groupement cohabitent volontairement :
#   - par FONCTION (web, db, ops)  -> ce que la machine fait
#   - par SYSTEME  (debian, rocky) -> comment on lui parle
# Une machine appartient aux deux. C'est le schema recommande : il evite
# d'ecrire `when: ansible_facts['os_family'] == ...` dans chaque tache.
all:
  # Ces variables sont declarees ICI, dans la source d'inventaire, et non dans
  # group_vars/ : le greffon `constructed` ne voit que les variables portees par
  # les sources d'inventaire.
  vars:
    parc_environnement: dev
  children:

    # --- Axe fonctionnel ---------------------------------------------------
    web:
      hosts:
        web01:
          ansible_host: 192.168.56.11
          rang_maintenance: canari
        web02:
          ansible_host: 192.168.56.12

    db:
      hosts:
        db01:
          ansible_host: 192.168.56.21

    # Le groupe ne s'appelle PAS `tools` : un groupe et un hote de meme nom
    # provoquent une ambiguite de resolution. La machine s'appelle `tools`,
    # le groupe s'appelle `ops`.
    ops:
      hosts:
        tools:
          ansible_host: 192.168.56.31

    # --- Axe systeme -------------------------------------------------------
    debian:
      hosts:
        web01:
        web02:
        tools:

    rocky:
      hosts:
        db01:

    # --- Groupe de groupes -------------------------------------------------
    # `serveurs` regroupe web et db : cible des operations de production.
    # La machine `tools` en est exclue, c'est de l'outillage.
    serveurs:
      children:
        web:
        db:
