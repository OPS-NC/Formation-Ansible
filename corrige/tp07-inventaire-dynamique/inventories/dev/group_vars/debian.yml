---
# Specificites Debian : ce sont des donnees, pas des conditions dans les taches.
# `htop` est disponible dans les depots Debian, contrairement a Rocky ou il
# n'existe que dans EPEL : c'est exactement le genre d'ecart que les variables
# de groupe absorbent.
paquets_base:
  - curl
  - htop
  - python3-apt
service_ntp: systemd-timesyncd
utilisateur_web: www-data
origine_variable: "defini dans group_vars/debian.yml"
paquet_ntp: systemd-timesyncd
