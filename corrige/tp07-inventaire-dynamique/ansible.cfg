# Configuration specifique au TP 07 : activation du cache de facts.
# A utiliser avec ANSIBLE_CONFIG=corrige/tp07-inventaire-dynamique/ansible.cfg
# ou en copiant ces options dans l'ansible.cfg du projet.

[defaults]
inventory = inventories/dev/

# Sans cache, les facts n'existent pas au moment ou l'inventaire est construit :
# les groupes bases sur des facts ne sont donc pas crees.
fact_caching            = jsonfile
fact_caching_connection = ./facts_cache
fact_caching_timeout    = 7200

# `smart` : collecte les facts seulement s'ils ne sont pas deja en cache.
gathering = smart

callback_result_format = yaml
interpreter_python     = auto_silent

[ssh_connection]
ssh_args   = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = true
