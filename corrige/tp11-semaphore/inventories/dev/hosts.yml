---
# Inventaire destine a une execution DEPUIS SEMAPHORE.
#
# Il differe de celui du TP 02 sur deux points, et ces deux points sont
# bloquants si on les ignore :
#
#   1. Aucune reference a `.vagrant/machines/.../private_key`. Ces cles sont
#      generees sur le poste du stagiaire et absentes du depot Git que
#      Semaphore clone. C'est le Key Store de Semaphore qui fournit la cle.
#
#   2. Connexion avec le compte de service `ansible` cree par le role `base`
#      au TP 03, et non `vagrant`. Une variable d'inventaire est prioritaire
#      sur une cle passee par l'interface : laisser `ansible_user: vagrant`
#      ici annulerait le choix fait dans le Key Store.
all:
  vars:
    ansible_user: ansible

  children:
    web:
      hosts:
        web01:
          ansible_host: 192.168.56.11
        web02:
          ansible_host: 192.168.56.12
    db:
      hosts:
        db01:
          ansible_host: 192.168.56.21
    ops:
      hosts:
        tools:
          ansible_host: 192.168.56.31
    debian:
      hosts:
        web01:
        web02:
        tools:
    rocky:
      hosts:
        db01:
    serveurs:
      children:
        web:
        db:
