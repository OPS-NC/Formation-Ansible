---
- name: Demonstration de lecture d un secret chiffre
  hosts: db
  gather_facts: false
  connection: local
  tasks:
    - name: Le secret est lisible apres dechiffrement
      ansible.builtin.debug:
        msg: >-
          base={{ postgresql_base }}
          compte={{ postgresql_compte }}
          longueur_mot_de_passe={{ postgresql_motdepasse | length }}
      # `no_log` masquerait TOUTE la sortie de la tache. Ici on n'affiche que
      # la longueur, jamais la valeur.
