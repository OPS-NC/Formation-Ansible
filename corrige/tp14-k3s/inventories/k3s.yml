---
# Inventaire du cluster k3s.
# La distinction serveur / agent est portee par les groupes : c'est elle qui
# decide des options passees a k3s.
all:
  children:
    k3s_cluster:
      children:

        k3s_server:
          hosts:
            k3s-master:
              ansible_host: 192.168.56.41

        k3s_agent:
          hosts:
            k3s-node01:
              ansible_host: 192.168.56.42
            k3s-node02:
              ansible_host: 192.168.56.43

      vars:
        ansible_user: vagrant
        ansible_ssh_private_key_file: ".vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key"
