---
# TP 14 - Deploiement applicatif sur le cluster, depuis le noeud de controle.
#
# Les modules kubernetes.core s'executent sur le CONTROLEUR et parlent a l'API
# Kubernetes : le play cible localhost, pas les noeuds du cluster.

- name: Deployer une application sur k3s
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    # Les modules kubernetes.core importent la bibliotheque Python
    # `kubernetes` AVEC L'INTERPRETEUR DE LA CIBLE. Ici la cible est
    # localhost, et `interpreter_python = auto_silent` (ansible.cfg) y fait
    # decouvrir le python du SYSTEME - pas celui de l'environnement virtuel
    # pipx dans lequel `pipx inject` a place la bibliotheque :
    #   Failed to import the required Python library (kubernetes) on
    #   <poste>'s Python /usr/bin/python3.14
    # `ansible_playbook_python` designe l'interpreteur qui execute
    # ansible-playbook, c'est-a-dire precisement celui du venv.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    kubeconfig: "{{ playbook_dir }}/kubeconfig"
    app_namespace: formation
    app_nom: vitrine
    app_image: docker.io/library/nginx:1.29-alpine
    app_replicas: 3
    app_domaine: lab.local

  tasks:

    - name: Verifier la presence du kubeconfig
      ansible.builtin.stat:
        path: "{{ kubeconfig }}"
      register: fichier_kubeconfig

    - name: Le cluster doit avoir ete monte au prealable
      ansible.builtin.assert:
        that:
          - fichier_kubeconfig.stat.exists
        fail_msg: "Lancez d abord cluster.yml : {{ kubeconfig }} est absent."

    - name: Lister les noeuds du cluster
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Node
      register: noeuds

    - name: Afficher les noeuds et leur adresse interne
      ansible.builtin.debug:
        msg: >-
          {{ item.metadata.name }} :
          {{ item.status.addresses | selectattr('type', 'eq', 'InternalIP')
             | map(attribute='address') | first }}
      loop: "{{ noeuds.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    # Verification du piege VirtualBox : si les trois noeuds affichent la meme
    # adresse, `node-ip` n'a pas ete applique et le reseau des pods est casse.
    - name: Les noeuds doivent avoir des adresses internes distinctes
      ansible.builtin.assert:
        that:
          - adresses | unique | length == adresses | length
        fail_msg: >-
          Plusieurs noeuds partagent la meme adresse interne ({{ adresses | join(', ') }}).
          L option node-ip n a pas ete prise en compte.
      vars:
        adresses: >-
          {{ noeuds.resources
             | map(attribute='status.addresses') | flatten
             | selectattr('type', 'eq', 'InternalIP')
             | map(attribute='address') | list }}

    - name: Creer le namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ app_namespace }}"

    # `template:` rend le gabarit Jinja2 SUR LE CONTROLEUR avant de l'envoyer
    # a l'API. Les manifestes deviennent parametrables comme n'importe quel
    # fichier de configuration.
    #
    # ATTENTION : ce rendu n'est PAS celui d'ansible.builtin.template. Les
    # variables que ce dernier injecte - `ansible_managed` en tete - n'y sont
    # pas definies, et le playbook echouerait sur
    #   AnsibleUndefinedVariable: 'ansible_managed' is undefined
    # Le gabarit contient TROIS ressources : Deployment, Service et Ingress.
    # Une condition d'attente commune serait fausse : `Available` n'existe que
    # sur un Deployment. Appliquee a un Service, l'attente expire.
    - name: Deployer l application
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        apply: true
        template: templates/application.yaml.j2

    - name: Attendre que le deploiement soit disponible
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        name: "{{ app_nom }}"
        namespace: "{{ app_namespace }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180

    - name: Verifier que le Service et l Ingress existent
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: "{{ item }}"
        name: "{{ app_nom }}"
        namespace: "{{ app_namespace }}"
      register: ressources_exposition
      failed_when: ressources_exposition.resources | length == 0
      loop:
        - Service
        - Ingress

    - name: Verifier que les replicas sont prets
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        name: "{{ app_nom }}"
        namespace: "{{ app_namespace }}"
      register: deploiement

    - name: Le nombre de replicas disponibles doit correspondre
      ansible.builtin.assert:
        that:
          - deploiement.resources[0].status.availableReplicas == app_replicas

    # Demonstration Helm. On evite deliberement metrics-server : k3s en deploie
    # deja un, et un second chart revendiquerait le meme APIService
    # v1beta1.metrics.k8s.io. podinfo est une application de demonstration
    # autonome, sans composant concurrent dans le cluster.
    - name: Ajouter un depot Helm
      kubernetes.core.helm_repository:
        name: podinfo
        repo_url: https://stefanprodan.github.io/podinfo

    - name: Installer le chart de demonstration
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig }}"
        name: podinfo
        chart_ref: podinfo/podinfo
        release_namespace: "{{ app_namespace }}"
        create_namespace: false
        wait: true
        values:
          replicaCount: 2
